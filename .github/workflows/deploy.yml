name: Deploy Worker

# Despliega el Worker a Cloudflare en cada push a main que toque servidor-mcp/.
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "servidor-mcp/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: servidor-mcp
        run: npm ci

      - name: Desplegar a Cloudflare Workers
        working-directory: servidor-mcp
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
