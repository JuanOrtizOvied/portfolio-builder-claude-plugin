<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabbi · Autorizar acceso</title>
<style>
  :root{
    --verde:#223A13; --verde-prof:#162200; --lima:#C3ED74; --crema:#F4F4ED;
    --texto:#162200; --gris:#5b6b4d; --borde:#d9ddcb; --error:#b3261e;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--crema);color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:16px}
  .card{background:#fff;width:100%;max-width:420px;border:1px solid var(--borde);border-radius:16px;
    box-shadow:0 10px 30px rgba(22,34,0,.08);overflow:hidden}
  .top{background:var(--verde);color:#fff;padding:22px 24px}
  .top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
  .top p{margin:6px 0 0;font-size:13px;opacity:.85}
  .body{padding:24px}
  .campo{margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;font:inherit;background:#fcfdf8}
  input:focus{outline:none;border-color:var(--verde)}
  .btn{width:100%;padding:12px 14px;border:none;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
  .btn-primario{background:var(--verde);color:#fff}
  .btn-primario:hover{background:var(--verde-prof)}
  .btn-lima{background:var(--lima);color:var(--verde-prof)}
  .btn-lima:hover{filter:brightness(.96)}
  .btn-sec{background:transparent;color:var(--verde);border:1px solid var(--borde)}
  .btn-sec:hover{border-color:var(--verde)}
  .acciones{display:flex;gap:10px;margin-top:18px}
  .acciones .btn{width:auto;flex:1}
  .link{background:none;border:none;color:var(--verde);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
  .meta{font-size:13px;color:var(--gris);margin:4px 0}
  .scopes{list-style:none;padding:0;margin:12px 0}
  .scopes li{padding:8px 12px;background:var(--crema);border-radius:8px;margin-bottom:6px;font-size:13px}
  .msg{font-size:13px;margin:10px 0 0;min-height:18px}
  .msg.err{color:var(--error)}
  .cargando{text-align:center;color:var(--gris);padding:12px}
  .hide{display:none}
  .pie{font-size:11px;color:var(--gris);text-align:center;padding:0 24px 18px}
  code{background:var(--crema);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <h1>Sabbi · Portafolio</h1>
    <p id="subtitulo">Autoriza el acceso a tu cuenta</p>
  </div>
  <div class="body">

    <div id="vista-cargando" class="cargando">Cargando…</div>

    <!-- Login / registro -->
    <form id="vista-login" class="hide" autocomplete="on">
      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" required autocomplete="email" placeholder="tu@correo.com">
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password" minlength="6" placeholder="••••••••">
      </div>
      <button id="btn-login" type="submit" class="btn btn-primario">Iniciar sesión</button>
      <p class="msg" id="msg-login"></p>
      <p class="meta">¿No tienes cuenta?
        <button id="toggle-registro" type="button" class="link">Crear una</button>
      </p>
    </form>

    <!-- Consentimiento -->
    <div id="vista-consent" class="hide">
      <p class="meta">La aplicación <strong id="app-nombre">una aplicación</strong> quiere acceder a tu cuenta de Sabbi.</p>
      <ul class="scopes" id="lista-scopes"></ul>
      <p class="meta" id="redir-info"></p>
      <div class="acciones">
        <button id="btn-denegar" class="btn btn-sec">Rechazar</button>
        <button id="btn-aprobar" class="btn btn-lima">Autorizar</button>
      </div>
      <p class="msg" id="msg-consent"></p>
      <p class="meta" style="margin-top:14px">
        Sesión de <strong id="user-email"></strong> ·
        <button id="btn-logout" class="link">cerrar sesión</button>
      </p>
    </div>

    <!-- Error -->
    <div id="vista-error" class="hide">
      <p class="msg err" id="texto-error"></p>
    </div>

  </div>
  <div class="pie">Tus datos de inversión solo se guardan si inicias sesión y lo autorizas.</div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// --- Configuración del proyecto Supabase ---
const SUPABASE_URL = "https://pecwcmjqeouiijzkmbpg.supabase.co";
// Publishable key (pública: va en el navegador por diseño; RLS protege los datos).
const SUPABASE_ANON_KEY = "sb_publishable_UN2GOMRxvmxznyahxFxZQA_NRv_SjtD";
// NOTA (spike): supabase-js se carga sin fijar versión exacta (@2). Antes de
// producción, fijar una versión concreta para evitar cambios inesperados.

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const params = new URLSearchParams(location.search);
const authorizationId = params.get("authorization_id");

const $ = (id) => document.getElementById(id);
const ver = (nombre) => {
  for (const v of ["cargando", "login", "consent", "error"]) {
    $(`vista-${v}`).classList.toggle("hide", v !== nombre);
  }
};
const error = (txt) => { $("texto-error").textContent = txt; ver("error"); };

let modoRegistro = false;

async function iniciar() {
  if (!authorizationId) {
    return error("Falta el parámetro de autorización. Abre esta página desde el flujo de inicio de sesión de Claude, no directamente.");
  }
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return ver("login");
  await mostrarConsentimiento(user);
}

async function mostrarConsentimiento(user) {
  ver("cargando");
  const { data, error: e } = await sb.auth.oauth.getAuthorizationDetails(authorizationId);
  if (e) return error("No pude cargar los detalles de la autorización: " + (e.message || e));

  // Si ya consentió antes, Supabase devuelve directamente el redirect.
  if (data && data.redirect_url && !data.authorization_id) {
    location.href = data.redirect_url;
    return;
  }

  const nombre = data?.client?.name || data?.client_name || data?.name || "una aplicación";
  const redir = data?.redirect_uri || data?.client?.redirect_uri || "";
  const scopeStr = data?.scope || data?.scopes || "";
  const scopes = (Array.isArray(scopeStr) ? scopeStr : String(scopeStr).split(/\s+/)).filter(Boolean);

  $("app-nombre").textContent = nombre;
  $("user-email").textContent = user.email || user.id;
  $("redir-info").textContent = redir ? `Te devolverá a: ${redir}` : "";
  $("lista-scopes").innerHTML = scopes.length
    ? scopes.map((s) => `<li>${s}</li>`).join("")
    : "<li>Acceso básico a tu cuenta</li>";
  ver("consent");
}

// --- Login / registro ---
$("toggle-registro").addEventListener("click", () => {
  modoRegistro = !modoRegistro;
  $("btn-login").textContent = modoRegistro ? "Crear cuenta" : "Iniciar sesión";
  $("toggle-registro").textContent = modoRegistro ? "Ya tengo cuenta" : "Crear una";
  $("password").setAttribute("autocomplete", modoRegistro ? "new-password" : "current-password");
  $("msg-login").textContent = "";
});

$("vista-login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const email = $("email").value.trim();
  const password = $("password").value;
  const msg = $("msg-login");
  msg.className = "msg"; msg.textContent = modoRegistro ? "Creando cuenta…" : "Entrando…";
  $("btn-login").disabled = true;
  try {
    const fn = modoRegistro
      ? sb.auth.signUp({ email, password })
      : sb.auth.signInWithPassword({ email, password });
    const { data, error: e } = await fn;
    if (e) { msg.className = "msg err"; msg.textContent = e.message; return; }
    if (modoRegistro && !data.session) {
      msg.className = "msg"; msg.textContent = "Cuenta creada. Revisa tu correo para confirmarla y vuelve a esta página.";
      return;
    }
    const { data: { user } } = await sb.auth.getUser();
    await mostrarConsentimiento(user);
  } finally {
    $("btn-login").disabled = false;
  }
});

// --- Consentimiento: aprobar / denegar ---
$("btn-aprobar").addEventListener("click", async () => {
  const msg = $("msg-consent"); msg.className = "msg"; msg.textContent = "Autorizando…";
  const { data, error: e } = await sb.auth.oauth.approveAuthorization(authorizationId);
  if (e) { msg.className = "msg err"; msg.textContent = e.message || String(e); return; }
  location.href = data.redirect_url;
});

$("btn-denegar").addEventListener("click", async () => {
  const msg = $("msg-consent"); msg.className = "msg"; msg.textContent = "Cancelando…";
  const { data, error: e } = await sb.auth.oauth.denyAuthorization(authorizationId);
  if (e) { msg.className = "msg err"; msg.textContent = e.message || String(e); return; }
  location.href = data.redirect_url;
});

$("btn-logout").addEventListener("click", async () => {
  await sb.auth.signOut();
  modoRegistro = false;
  ver("login");
});

iniciar().catch((e) => error("Error inesperado: " + (e?.message || e)));
</script>
</body>
</html>
